name: Build and Run

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytorch-flower:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
          python -m pip check
          python -m compileall -q src/fedstar scripts
      - name: Prepare Real Audio
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          from fedstar.data import CLASSES
          from fedstar.preparation import SPEECH_BASE, SPEECH_ARCHIVES, download, extract_archive, finish_manifest
          name, digest = SPEECH_ARCHIVES['test']
          audio = extract_archive(download(SPEECH_BASE + name, Path('data/downloads') / name, digest), Path('data/ci-audio'))
          records = []
          for label, word in enumerate(CLASSES['speech_commands']):
              folder = {'silence': '_silence_', 'unknown': '_unknown_'}.get(word, word)
              pools = {'train': [], 'test': []}
              for path in sorted((audio / folder).glob('*.wav')):
                  speaker = path.stem.split('_nohash_')[0]
                  split = 'test' if int(hashlib.sha256(speaker.encode()).hexdigest(), 16) % 5 == 0 else 'train'
                  pools[split].append(path)
              for split, count in [('train', 4), ('test', 2)]:
                  assert len(pools[split]) >= count, (folder, split)
                  for path in pools[split][:count]:
                      records.append({'id': f'{folder}/{path.name}', 'path': str(path.resolve()), 'label': label, 'split': split})
          finish_manifest('speech_commands', 'data/speech_commands', records,
                          {'purpose': 'Bounded CI integration subset of real audio; speaker-disjoint, not a benchmark split'})
          # Exercise the contrastive pipeline on real CI clips, separately from the FSD50K experiment.
          clips = [dict(r, label=-1) for r in records if r['split'] == 'train'][:6]
          finish_manifest('fsd50k', 'data/contrastive-ci/fsd50k', clips,
                          {'purpose': 'Real-audio pipeline integration only; not FSD50K training'})
          PY
      - name: Pretrain and Resume
        env:
          OMP_NUM_THREADS: '1'
        run: |
          python scripts/prepare_model.py --data-root data/contrastive-ci --output checkpoints/ci --epochs 1 --batch-size 3 --device cpu
          python scripts/prepare_model.py --data-root data/contrastive-ci --output checkpoints/ci --epochs 2 --batch-size 3 --device cpu --resume
      - name: Run Native Flower Methods
        env:
          FLWR_DISABLE_RUNTIME_DEPENDENCY_INSTALLATION: '1'
        run: |
          common=(--dataset speech_commands --nr-clients 2 --rounds 2 --participation 1
                  --batch-size 8 --labeled-fraction .5 --device cpu)
          python scripts/run_experiment.py "${common[@]}" --method fedstar
          python scripts/run_experiment.py "${common[@]}" --method fedavg
          python scripts/run_experiment.py "${common[@]}" --method fedavg --labeled-fraction 1
          python scripts/run_experiment.py "${common[@]}" --method centralized --labeled-fraction 1
          python scripts/run_experiment.py "${common[@]}" --method fedstar --pretrained-encoder checkpoints/ci/encoder.pt
          python - <<'PY'
          from pathlib import Path
          import json, math
          results = list(Path('results').glob('*.json'))
          assert len(results) == 5
          for path in results:
              result = json.loads(path.read_text())
              assert len(result['rounds']) == 2
              assert all(math.isfinite(r['loss']) and 0 <= r['accuracy'] <= 1 for r in result['rounds'])
              assert path.with_suffix('.pt').is_file()
              clients = result['rounds'][0]['clients']
              assert len(clients) == (1 if result['config']['method'] == 'centralized' else 2)
          PY
      - name: Check Patch
        run: git diff-tree --check HEAD
