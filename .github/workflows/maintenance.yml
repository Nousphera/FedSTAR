name: Maintenance checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install maintenance tools
        run: python -m pip install cffconvert==2.0.0 '.[flower,test]'
      - name: Validate citation metadata
        run: cffconvert --validate
      - name: Compile Python sources
        run: python -m compileall -q fedstar tests
      - name: Run maintenance regression tests
        run: python -m pytest -q
      - name: Sequential training smoke
        run: fedstar train --config configs/smoke.json
      - name: Native Flower App smoke
        env:
          FLWR_DISABLE_RUNTIME_DEPENDENCY_INSTALLATION: '1'
        run: |
          flwr run . --stream --run-config "output='$(pwd)/runs/flower-smoke'" \
            --federation-config 'num-supernodes=2 client-resources-num-cpus=1 init-args-num-cpus=2'
          python - <<'PYVERIFY'
          import json
          from pathlib import Path
          result = json.loads(Path("runs/flower-smoke/metrics.json").read_text())
          rounds = [row for row in result["rounds"] if row["round"] > 0]
          assert len(rounds) == 2 and all(len(row["client_metrics"]) == 2 for row in rounds)
          assert Path("runs/flower-smoke/model.keras").is_file()
          PYVERIFY
      - name: Check whitespace
        run: git show --format= --check HEAD
